[buildPlans.trulle-mono-cornered-narrow-fat]
family = "Trulle Mono Cornered Narrow Fat"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = true

# ==========================================
# UPRIGHT VARIANTS (Pystyjen merkkien muodot)
# ==========================================
[buildPlans.trulle-mono-cornered-narrow-fat.variants.design]
capital-a = "round-top-serifless" #capital-a = "round-top-base-serifed"
capital-b = "standard-serifless" # B
capital-c = "serifless" # C
capital-d = "more-rounded-serifless" # D
capital-e = "serifless" # E
capital-f = "serifless" # F
capital-g = "flat-bottom-serifless-hooked" #capital-g = "toothless-corner-serifless-hooked" # G
capital-h = "serifless" # H
capital-i = "short-serifed"
capital-j = "serifed-symmetric"
capital-k = "symmetric-touching-serifless" # K
capital-l = "serifless" # L
capital-m = "hanging-serifless" # M
capital-n = "standard-serifless" # N
capital-p = "closed-serifless" # P
capital-q = "straight" #capital-q = "vertical-crossing" # Q
capital-r = "straight-serifless" # R
capital-s = "serifless" # S
capital-t = "serifless" # T
capital-u = "toothless-rounded-serifless" # U
capital-v = "straight-serifless" # V
capital-w = "rounded-vertical-sides-serifless" #capital-w = "rounded-vertical-sides-serifed"
capital-x = "straight-serifless" # X
capital-y = "straight-serifless" # Y
capital-z = "straight-serifless" # Z

# Pienet kirjaimet (Upright)
a = "single-storey-flat-top-serifless" # a = "double-storey-serifless"
b = "flat-bottom-serifless" # b = "toothless-rounded-serifless"
c = "serifless"
d = "flat-bottom-serifless" # d = "toothless-rounded-serifless"
e = "flat-crossbar"
f = "flat-hook-serifless-crossbar-at-x-height"
g = "single-storey-flat-top-serifless" #g = "single-storey-earless-corner" # g = "single-storey-earless-rounded"
h = "straight-serifless"
i = "zshaped" #i = "serifless" #i = "hooky" # i = "semi-tailed"
j = "hooky" #j = "hooky" #j = "straight-line"
k = "symmetric-touching-serifless"
l = "zshaped" #l = "hooky-bottom" #l = "zshaped" #l = "serifless" # l = "semi-tailed"
m = "flat-top-serifless"
n = "flat-top-straight-serifless"
p = "flat-top-serifless" # p = "earless-corner-serifless" # p = "earless-rounded-serifless"
q = "flat-top-straight-serifless" # q = "earless-corner-straight-serifless" # q = "earless-rounded-straight-serifless"
r = "flat-top-serifless" #r = "hookless-serifless"
s = "serifless"
t = "hookless"
u = "toothless-rounded-serifless"
v = "straight-serifless"
w = "rounded-vertical-sides-flat-top-serifless"
x = "straight-serifless"
y = "cursive-serifless" #y = "straight-serifless"
z = "straight-serifless"

# Numerot ja erikoismerkit (Täydelliset Clojure/LaTeX/Fish -työskentelyyn)
zero = "tall-slashed"
one = "no-base"
two = "straight-neck-serifless"
three = "two-arcs"
four = "semi-open-non-crossing-serifless"
five = "upright-flat-serifless"
six = "closed-contour"
seven = "straight-serifless"
eight = "crossing"
nine = "closed-contour"

diacritic-dot = "round"
punctuation-dot = "round"
tilde = "high"
asterisk = "hex-high"
underscore = "low"
caret = "high"
paren = "large-contour"
brace = "curly-flat-boundary"
guillemet = "straight"
number-sign = "upright-open"
ampersand = "et-flat-bottom" # ampersand = "closed"
at = "fourfold-solid-inner"
dollar = "open-cap"
percent = "rings-continuous-slash"
bar = "natural-slope"
ascii-single-quote = "straight"
ascii-grave = "straight"
question = "corner"
cent = "open-cap"
partial-derivative = "straight-bar"
micro-sign = "toothless-rounded-serifless"

lig-ltgteq = "slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"


# ==========================================
# ITALIC VARIANTS (Kursiivin omat muodot)
# ==========================================

[buildPlans.trulle-mono-cornered-narrow-fat.variants.italic]
capital-a = "straight-serifless"
capital-b = "more-asymmetric-serifless"
capital-c = "serifless" # C
capital-d = "more-rounded-serifless" # D
capital-e = "serifless" # E
capital-f = "serifless" # F
capital-g = "toothless-rounded-serifless-hookless"
capital-h = "serifless" # H
capital-i = "serifless" # I
capital-j = "serifless" # L
capital-k = "symmetric-touching-serifless" # K
capital-l = "serifless" # L
capital-m = "hanging-serifless" # M
capital-n = "standard-serifless" # N
capital-p = "closed-serifless" # P
capital-q = "vertical-crossing" # Q
capital-r = "straight-serifless" # R
capital-s = "serifless" # S
capital-t = "serifless" # T
capital-u = "toothless-rounded-serifless" # U
capital-v = "straight-serifless" # V
capital-w = "rounded-vertical-sides-flat-top-serifless" # W
capital-x = "straight-serifless" # X
capital-y = "straight-serifless" # Y
capital-z = "straight-serifless" # Z
a = "double-storey-toothless-rounded"
b = "toothless-rounded-serifless"
c = "serifless"
d = "toothless-rounded-serifless"
e = "flat-crossbar"
f = "flat-hook-tailed-crossbar-at-x-height"#f = "flat-hook-extended-crossbar-at-x-height" # f = "flat-hook-extended-crossbar-at-half-ascender-height"
g = "single-storey-earless-rounded"
h = "straight-serifless"
i = "tailed" #i = "serifless"
j = "narrow-serifless"
k = "symmetric-touching-serifless"
l = "tailed"
m = "earless-rounded-double-arch-serifless"
n = "earless-rounded-straight-serifless"
p = "earless-rounded-serifless"
q = "earless-rounded-straight-serifless"
r = "hookless-serifless"
s = "serifless"
t = "hookless"
u = "toothless-rounded-serifless"
v = "straight-serifless"
w = "rounded-vertical-sides-flat-top-serifless"
x = "straight-serifless"
y = "cursive-serifless"
z = "straight-serifless"
ampersand = "et-toothless-rounded"
brace = "straight"

# ==========================================
# LIGATUURIT, PAKSUUDET JA MITAT
# ==========================================
[buildPlans.trulle-mono-cornered-narrow-fat.ligations]
inherits = "default-calt"  # <-- MUUTETTU: Takaa Clojuren nuolten ja operaattorien toimivuuden out-of-the-box

[buildPlans.trulle-mono-cornered-narrow-fat.weights.regular]
shape = 350
menu = 400
css = 400

[buildPlans.trulle-mono-cornered-narrow-fat.weights.bold]
shape = 500
menu = 700
css = 700

[buildPlans.trulle-mono-cornered-narrow-fat.widths.normal]
shape = 560 #shape = 570 #510 #500 #570 #580
menu = 5
css = "normal"

[buildPlans.trulle-mono-cornered-narrow-fat.metricOverride]
leading = 1150
sb = "default_sb * 0.01 + 80"#sb = "default_sb * 0.01 + 90"#sb = "default_sb * 0.01 + 100"#sb = "default_sb * 0.02 + 110"#sb = "default_sb * 0.02 + 130"#sb = "default_sb * 0.05 + 130"#sb = "default_sb * 0.1 + 120"#sb = "default_sb * 0.1 + 105"#sb = "default_sb * 0.3 + 105"#sb = "default_sb * 0.3 + 110"#sb = "default_sb * 0.3 + 100"#sb = "default_sb * 0.4 + 90"#sb = "default_sb * 0.4 + 75"#sb = "default_sb * 0.5 + 75"#sb = "default_sb * 0.5 + 75"#sb = "default_sb * 0.5 + 70"#sb = "default_sb * 0.6 + 70" #sb = "default_sb * 0.7 + 70" #sb = "default_sb * 0.7 + 65" #sb = "default_sb * 0.7 + 60" #sb = "default_sb * 0.7 + 55" #sb = "default_sb * 0.7 + 50"#sb = "default_sb * 0.7 + 45"  #sb = "default_sb * 0.7 + 39" #sb = "default_sb * 0.7 + 28" #sb = "default_sb * 0.9 + 28" #sb = "default_sb * 0.7 + 28" #sb = "default_sb * 1.1 + 28" #sb = "default_sb * 1.1 + 28" # sb = "default_sb * 1.2 + 28" #sb = "default_sb * 1.2 + 26" #sb = "default_sb * 1.2 + 24"

# ==========================================
# KALLISTUSKULMAT (Slopes)
# ==========================================
[buildPlans.trulle-mono-cornered-narrow-fat.slopes.upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.trulle-mono-cornered-narrow-fat.slopes.italic]
angle = 3.9
shape = "italic"
menu = "italic"
css = "italic"

