# ==========================================
# LIGATUURIT, PAKSUUDET JA MITAT
# ==========================================
[buildPlans.trulle-mono-slab.ligations]
inherits = "default-calt"  # <-- MUUTETTU: Takaa Clojuren nuolten ja operaattorien toimivuuden out-of-the-box

[buildPlans.trulle-mono-slab.weights.regular]
shape = 200
menu = 400
css = 400

[buildPlans.trulle-mono-slab.weights.bold]
shape = 300
menu = 700
css = 700

[buildPlans.trulle-mono-slab.widths.normal]
shape = 570 #510 #500 #570 #580
menu = 5
css = "normal"

[buildPlans.trulle-mono-slab.metricOverride]
leading = 1150
sb = "default_sb * 1.1 + 43" #sb = "default_sb * 0.9 + 43" #sb = "default_sb * 0.9 + 48" #sb = "default_sb * 0.9 + 38" #sb = "default_sb * 0.9 + 28" #sb = "default_sb * 0.7 + 28" #sb = "default_sb * 1.1 + 28" #sb = "default_sb * 1.1 + 28" # sb = "default_sb * 1.2 + 28" #sb = "default_sb * 1.2 + 26" #sb = "default_sb * 1.2 + 24"

# ==========================================
# KALLISTUSKULMAT (Slopes)
# ==========================================
[buildPlans.trulle-mono-slab.slopes.upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.trulle-mono-slab.slopes.italic]
angle = 3.9
shape = "italic"
menu = "italic"
css = "italic"
