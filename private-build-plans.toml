[buildPlans.trulle-mono-slab]
family = "Trulle Mono Slab"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = true

# ==========================================
# UPRIGHT VARIANTS (Pystyjen merkkien muodot)
# ==========================================
[buildPlans.trulle-mono-slab.variants.design]
capital-a = "round-top-base-serifed"
capital-b = "standard-bilateral-serifed"
capital-c = "bilateral-serifed"
capital-d = "standard-bilateral-serifed"
capital-e = "serifed"
capital-f = "serifed"
capital-g = "flat-bottom-serifed-hooked"
capital-h = "serifed"
capital-i = "short-serifed"
capital-j = "serifed-symmetric"
capital-k = "symmetric-touching-serifed"
capital-l = "serifed"
capital-m = "hanging-serifed"
capital-n = "standard-serifed"
capital-p = "closed-serifed"
capital-q = "vertical-crossing"
capital-r = "standing-serifed"
capital-s = "bilateral-serifed"
capital-t = "serifed"
capital-u = "toothless-rounded-serifed"
capital-v = "straight-serifed"
capital-w = "rounded-vertical-sides-serifed"
capital-x = "straight-serifed"
capital-y = "straight-serifed"
capital-z = "straight-serifed"
# Pienet kirjaimet (Upright)
a = "double-storey-hook-inward-serifed-flat-bottom-serifed"#a = "double-storey-flat-bottom-serifed"#a = "single-storey-flat-top-serifed"
b = "flat-bottom-motion-serifed"
c = "bilateral-inward-serifed"#c = "bilateral-serifed"
d = "flat-bottom-top-serifed"
f = "flat-hook-serifed-crossbar-at-x-height"
g = "single-storey-flat-top-serifed"
h = "straight-serifed"
i = "zshaped"
j = "hooky"
k = "symmetric-connected-serifed"
l = "zshaped"
m = "flat-top-serifed"
n = "flat-top-straight-serifed"
p = "flat-top-motion-serifed"
q = "flat-top-straight-motion-serifed"
r = "flat-top-serifed"
s = "bilateral-inward-serifed"#s = "bilateral-serifed"
t = "hookless"
u = "toothless-rounded-serifed"
v = "straight-serifed"
w = "rounded-vertical-sides-flat-top-serifed"
x = "curly-serifed"
y = "cursive-serifed"
z = "straight-serifed"

# Numerot ja erikoismerkit (Täydelliset Clojure/LaTeX/Fish -työskentelyyn)
one = "base"#one = "base-flat-top-serif"
two = "curly-neck-serifed"
three = "flat-top-serifed"
four = "semi-open-non-crossing-serifed"
five = "upright-flat-serifed"
six = "closed-contour"
seven = "straight-serifed"
eight = "two-circles"
nine = "closed-contour"
zero = "tall-slashed"
# zero = "tall-slashed"
# one = "no-base"
# two = "straight-neck-serifless"
# three = "two-arcs"
# four = "semi-open-non-crossing-serifless"
# five = "upright-flat-serifless"
# six = "closed-contour"
# seven = "straight-serifless"
# eight = "crossing"
# nine = "closed-contour"

diacritic-dot = "round"
punctuation-dot = "round"
tilde = "high"
asterisk = "hex-high"
underscore = "low"
caret = "high"
paren = "large-contour"
brace = "curly-flat-boundary"
guillemet = "straight"
number-sign = "upright-open"
ampersand = "et-flat-bottom" # ampersand = "closed"
at = "fourfold-solid-inner"
dollar = "open-cap"
percent = "rings-continuous-slash"
bar = "natural-slope"
ascii-single-quote = "straight"
ascii-grave = "straight"
question = "corner"
cent = "open-cap"
partial-derivative = "straight-bar"
micro-sign = "toothless-rounded-serifed"#micro-sign = "toothless-rounded-serifless"

lig-ltgteq = "slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"


